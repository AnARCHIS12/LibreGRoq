<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreGRoq</title>
    <link rel="icon" href="https://console.groq.com/groq-logo.svg" type="image/svg+xml">
    <script type="module" src="https://unpkg.com/deep-chat-dev@latest/dist/deepChat.bundle.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070708;
            --panel: #101114;
            --panel-soft: #1d0f12;
            --text: #fff5f5;
            --muted: #c9a5a5;
            --line: #3a1b20;
            --accent: #ef233c;
            --accent-strong: #b80f24;
            --danger: #ff6b6b;
            --shadow: 0 20px 56px rgba(239, 35, 60, 0.16);
        }

        body[data-theme="light"] {
            color-scheme: light;
            --bg: #f7f8fb;
            --panel: #ffffff;
            --panel-soft: #eef3f8;
            --text: #17202a;
            --muted: #5f6f82;
            --line: #d9e0e8;
            --accent: #0f766e;
            --accent-strong: #115e59;
            --danger: #b42318;
            --shadow: 0 18px 48px rgba(23, 32, 42, 0.11);
        }

        body[data-theme="redblack"] {
            color-scheme: dark;
            --bg: #070708;
            --panel: #101114;
            --panel-soft: #1d0f12;
            --text: #fff5f5;
            --muted: #c9a5a5;
            --line: #3a1b20;
            --accent: #ef233c;
            --accent-strong: #b80f24;
            --danger: #ff6b6b;
            --shadow: 0 20px 56px rgba(239, 35, 60, 0.16);
        }

        body[data-theme="cyberpunk"] {
            color-scheme: dark;
            --bg: #05040f;
            --panel: #0d1022;
            --panel-soft: #171735;
            --text: #f5f3ff;
            --muted: #a7b7ff;
            --line: #32305f;
            --accent: #00e5ff;
            --accent-strong: #ff2bd6;
            --danger: #ff3b6b;
            --shadow: 0 22px 60px rgba(0, 229, 255, 0.18);
        }

        body[data-theme="cyberpunk"] .chat-panel,
        body[data-theme="cyberpunk"] .settings {
            box-shadow:
                0 0 0 1px rgba(0, 229, 255, 0.14),
                0 22px 60px rgba(255, 43, 214, 0.14);
        }

        body[data-theme="cyberpunk"] .status-dot {
            box-shadow: 0 0 12px var(--accent);
        }

        body[data-theme="cyberpunk"] {
            background:
                radial-gradient(circle at 12% 0%, rgba(0, 229, 255, 0.20), transparent 26rem),
                radial-gradient(circle at 88% 12%, rgba(255, 43, 214, 0.18), transparent 24rem),
                linear-gradient(135deg, #05040f 0%, #090821 48%, #13061a 100%);
        }

        body[data-theme="cyberpunk"] .chat-header {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.10), rgba(255, 43, 214, 0.08));
        }

        body[data-theme="cyberpunk"] .settings-link,
        body[data-theme="cyberpunk"] .ghost-button {
            box-shadow: inset 0 0 0 1px rgba(0, 229, 255, 0.08);
        }

        body[data-theme="dark"] {
            color-scheme: dark;
            --bg: #101418;
            --panel: #171d23;
            --panel-soft: #24303a;
            --text: #eef3f8;
            --muted: #aab7c4;
            --line: #33414e;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --danger: #fb7185;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        }

        body[data-theme="forest"] {
            --bg: #f4f8f3;
            --panel: #ffffff;
            --panel-soft: #e7efe5;
            --text: #172118;
            --muted: #627163;
            --line: #d6e1d3;
            --accent: #2f7d46;
            --accent-strong: #246537;
            --danger: #a9382b;
            --shadow: 0 18px 48px rgba(32, 55, 35, 0.12);
        }

        body[data-theme="sunset"] {
            --bg: #fbf7f1;
            --panel: #ffffff;
            --panel-soft: #f3ece2;
            --text: #261b17;
            --muted: #75645c;
            --line: #e5d8cc;
            --accent: #c8553d;
            --accent-strong: #a74431;
            --danger: #b42318;
            --shadow: 0 18px 48px rgba(91, 58, 41, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(239, 35, 60, 0.18), transparent 34rem),
                var(--bg);
            color: var(--text);
        }

        .app-shell {
            display: block;
            width: min(980px, calc(100% - 32px));
            min-height: calc(100vh - 32px);
            height: calc(100svh - 32px);
            margin: 16px auto;
        }

        .settings,
        .chat-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .settings {
            position: fixed;
            top: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 20;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            width: min(390px, calc(100vw - 32px));
            max-height: calc(100dvh - 32px);
            overflow: hidden;
            padding: 18px;
            transform: translateX(calc(100% + 24px));
            transition: transform 180ms ease;
            pointer-events: none;
        }

        body.settings-open .settings {
            transform: translateX(0);
            pointer-events: auto;
        }

        .settings-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            border: 0;
            border-radius: 0;
            background: rgba(15, 23, 42, 0.36);
            cursor: default;
        }

        body.settings-open .settings-backdrop {
            display: block;
        }

        .history-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            bottom: 16px;
            z-index: 20;
            display: grid;
            grid-template-rows: auto auto auto minmax(0, 1fr);
            width: min(340px, calc(100vw - 32px));
            padding: 16px;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            transform: translateX(calc(-100% - 24px));
            transition: transform 180ms ease;
            pointer-events: none;
        }

        body.history-open .history-panel {
            transform: translateX(0);
            pointer-events: auto;
        }

        .history-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            border: 0;
            border-radius: 0;
            background: rgba(15, 23, 42, 0.36);
            cursor: default;
        }

        body.history-open .history-backdrop {
            display: block;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: none;
            place-items: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.58);
        }

        body.modal-open .modal-backdrop {
            display: grid;
        }

        .modal-card {
            display: grid;
            gap: 14px;
            width: min(420px, 100%);
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        body[data-theme="cyberpunk"] .modal-card {
            box-shadow:
                0 0 0 1px rgba(0, 229, 255, 0.16),
                0 24px 70px rgba(255, 43, 214, 0.20);
        }

        .modal-title {
            margin: 0;
            color: var(--text);
            font-size: 1.05rem;
        }

        .modal-message {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }

        .modal-input {
            display: none;
        }

        .modal-card.has-input .modal-input {
            display: block;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .history-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .history-search {
            margin-bottom: 12px;
        }

        .history-list {
            display: grid;
            align-content: start;
            gap: 8px;
            min-height: 0;
            overflow: auto;
            padding-right: 2px;
        }

        .history-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-soft);
        }

        .history-item.is-active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent);
        }

        .history-item-main {
            min-width: 0;
            border: 0;
            padding: 0;
            color: var(--text);
            background: transparent;
            text-align: left;
            font: inherit;
            font-weight: 700;
        }

        .history-item-title,
        .history-item-time {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-time {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 500;
        }

        .history-delete {
            display: inline-grid;
            place-items: center;
            width: 30px;
            min-width: 30px;
            min-height: 30px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--danger);
            background: var(--panel);
            line-height: 1;
        }

        .history-item-actions {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .history-icon-button {
            display: inline-grid;
            place-items: center;
            width: 30px;
            min-width: 30px;
            min-height: 30px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--text);
            background: var(--panel);
            line-height: 1;
        }

        .history-icon-button.is-pinned {
            color: var(--accent);
            border-color: var(--accent);
        }

        .history-empty {
            padding: 14px;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 8px;
            text-align: center;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .settings-title-row {
            display: grid;
            gap: 4px;
            min-width: 0;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            padding: 5px;
            border: 1px solid color-mix(in srgb, var(--accent) 28%, #ffffff);
            border-radius: 8px;
            background: #ffffff;
            object-fit: contain;
            filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 34%, transparent));
        }

        .settings-actions {
            display: flex;
            flex: 0 0 auto;
            gap: 8px;
            align-items: center;
        }

        .settings-close {
            display: inline-grid;
            place-items: center;
            width: 34px;
            min-width: 34px;
            min-height: 34px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            color: var(--text);
            font-size: 1.2rem;
            line-height: 1;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.25;
        }

        .save-state {
            min-width: 92px;
            padding: 5px 8px;
            border-radius: 999px;
            background: var(--panel-soft);
            color: var(--muted);
            font-size: 0.78rem;
            text-align: center;
            white-space: nowrap;
        }

        .save-state.is-saved {
            background: #dff4ec;
            color: #136344;
        }

        body[data-theme="dark"] .save-state.is-saved {
            background: #12352f;
            color: #86efac;
        }

        body[data-theme="redblack"] .save-state.is-saved {
            background: #2a1015;
            color: #ff8a98;
        }

        body[data-theme="cyberpunk"] .save-state.is-saved {
            background: #10263a;
            color: #7df9ff;
        }

        .form-grid {
            display: grid;
            align-content: start;
            gap: 14px;
            min-height: 0;
            overflow: auto;
            padding: 14px 2px 12px;
        }

        .section-label {
            margin: 4px 0 -4px;
            color: var(--text);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .compact-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .compact-actions.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hidden-file {
            display: none;
        }

        label {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .check-row input {
            width: 18px;
            min-width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .field-hint {
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .field-hint a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .field-hint a:hover {
            text-decoration: underline;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 11px;
            color: var(--text);
            background: var(--panel);
            font: inherit;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
            border-color: var(--accent);
        }

        .field-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 104px;
            gap: 10px;
            align-items: end;
        }

        .range-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 58px;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            padding: 0;
            accent-color: var(--accent);
        }

        .temperature-value {
            color: var(--text);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .actions {
            position: sticky;
            bottom: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            padding-top: 10px;
            background: var(--panel);
            border-top: 1px solid var(--line);
        }

        button {
            min-height: 42px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 9px 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button {
            background: var(--accent);
            color: #fff;
        }

        .primary-button:hover {
            background: var(--accent-strong);
        }

        .ghost-button {
            background: var(--panel);
            color: var(--text);
            border-color: var(--line);
        }

        .ghost-button:hover {
            background: var(--panel-soft);
        }

        .danger-button {
            color: var(--danger);
        }

        .note {
            margin: 0;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .chat-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .chat-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: flex-start;
            padding: 14px 16px 13px;
            border-bottom: 1px solid var(--line);
        }

        .chat-heading {
            display: grid;
            min-width: 0;
            gap: 3px;
        }

        .chat-title {
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1.05rem;
            line-height: 1.25;
        }

        .chat-subtitle {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .chat-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            min-width: 0;
        }

        .model-chip {
            max-width: min(340px, 48vw);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--panel-soft);
            color: var(--muted);
            font-size: 0.8rem;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            background: var(--panel-soft);
            color: var(--muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        .settings-link {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 5px 9px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--text);
            background: var(--panel);
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        #chatMount {
            height: 100%;
            min-height: 0;
            background: var(--panel);
        }

        deep-chat {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            border-radius: 0;
        }

        .empty-chat {
            display: grid;
            place-items: center;
            height: 100%;
            min-height: 0;
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        .empty-chat-content {
            display: grid;
            justify-items: center;
            gap: 14px;
            max-width: 320px;
        }

        .empty-chat-action {
            display: inline-flex;
            align-items: center;
            border: 0;
            min-height: 40px;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 820px) {
            .app-shell {
                width: min(100% - 16px, 640px);
                height: calc(100svh - 16px);
                height: calc(100dvh - 16px);
                min-height: calc(100svh - 16px);
                margin: 8px auto;
            }

            .chat-panel {
                height: 100%;
                min-height: 0;
            }

            .settings {
                top: 8px;
                right: 8px;
                bottom: 8px;
                width: min(430px, calc(100vw - 16px));
            }

            .history-panel {
                top: 8px;
                left: 8px;
                bottom: 8px;
                width: min(430px, calc(100vw - 16px));
            }

            #chatMount,
            deep-chat,
            .empty-chat {
                min-height: 0;
            }

            .chat-header {
                padding: 12px;
            }

            .chat-meta {
                flex: 0 0 auto;
                display: grid;
                grid-template-columns: repeat(3, auto);
                justify-items: end;
            }

            .model-chip {
                display: none;
            }
        }

        @media (max-width: 460px) {
            .settings-header,
            .actions,
            .field-row {
                grid-template-columns: 1fr;
            }

            .settings-header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
            }

            .chat-header {
                align-items: center;
                gap: 8px;
            }

            .chat-title {
                max-width: 48vw;
                font-size: 0.98rem;
            }

            .chat-subtitle {
                display: none;
            }

            .chat-meta {
                grid-template-columns: repeat(3, auto);
                gap: 6px;
            }

            .model-chip {
                display: none;
            }

            .save-state,
            .model-chip {
                max-width: 100%;
                justify-self: start;
            }

            .status-chip,
            .settings-link {
                min-height: 32px;
                padding: 5px 7px;
                font-size: 0.76rem;
            }

            .status-chip {
                display: none;
            }
        }

        @media (max-width: 360px) {
            .chat-title {
                max-width: 36vw;
            }

            .chat-title {
                max-width: 44vw;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <section class="history-panel" id="historyPanel" aria-labelledby="historyTitle">
            <div class="history-header">
                <div class="brand-row">
                    <img class="brand-logo" src="https://console.groq.com/groq-logo.svg" alt="">
                    <h1 id="historyTitle">Historique</h1>
                </div>
                <button class="settings-close" id="closeHistory" type="button" aria-label="Fermer l'historique">×</button>
            </div>
            <div class="history-actions">
                <button class="primary-button" id="newChat" type="button">Nouveau</button>
                <button class="ghost-button danger-button" id="clearChats" type="button">Tout effacer</button>
            </div>
            <label class="history-search">
                Recherche
                <input id="historySearch" type="search" placeholder="Chercher dans les chats...">
            </label>
            <div class="history-list" id="historyList"></div>
        </section>
        <button class="history-backdrop" id="historyBackdrop" type="button" aria-label="Fermer l'historique"></button>
        <div class="modal-backdrop" id="appModal" aria-hidden="true">

    <script>
        const DB_NAME = "groq-chat-db";
        const DB_VERSION = 2;
        const STORE_NAME = "settings";
        const CONVERSATION_STORE_NAME = "conversations";
        const CONFIG_ID = "active-config";
        const PROFILES_STATE_ID = "profiles-state";
        const LEGACY_STORAGE_KEY = "groq-chat-config";
        const MAX_STORED_MESSAGES = 1200;
        const MAX_STORED_CHARACTERS = 800000;
        const MAX_CONTEXT_MESSAGES = 48;
        const defaultConfig = {
            appName: "LibreGRoq",
            theme: "redblack",
            apiKey: "",
            model: "openai/gpt-oss-20b",
            audioModel: "whisper-large-v3-turbo",
            temperature: 0.7,
            systemPrompt: "Tu es un assistant utile, clair et concis.",
            memoryNotes: "",
            autoMemory: true
        };

        const form = document.querySelector("#configForm");
        const appNameInput = document.querySelector("#appName");
        const themeInput = document.querySelector("#theme");
        const apiKeyInput = document.querySelector("#apiKey");
        const modelInput = document.querySelector("#model");
        const audioModelInput = document.querySelector("#audioModel");
        const temperatureInput = document.querySelector("#temperature");
        const temperatureValue = document.querySelector("#temperatureValue");
        const systemPromptInput = document.querySelector("#systemPrompt");
        const memoryNotesInput = document.querySelector("#memoryNotes");
        const autoMemoryInput = document.querySelector("#autoMemory");
        const saveState = document.querySelector("#saveState");
        const chatTitle = document.querySelector("#chatTitle");
        const chatStatus = document.querySelector("#chatStatus");
        const activeModel = document.querySelector("#activeModel");
        const chatMount = document.querySelector("#chatMount");
        const openHistory = document.querySelector("#openHistory");
        const closeHistory = document.querySelector("#closeHistory");
        const historyBackdrop = document.querySelector("#historyBackdrop");
        const historyList = document.querySelector("#historyList");
        const historySearch = document.querySelector("#historySearch");
        const appModal = document.querySelector("#appModal");
        const modalCard = document.querySelector("#modalCard");
        const modalTitle = document.querySelector("#modalTitle");
        const modalMessage = document.querySelector("#modalMessage");
        const modalInput = document.querySelector("#modalInput");
        const modalCancel = document.querySelector("#modalCancel");
        const modalConfirm = document.querySelector("#modalConfirm");
        const newChat = document.querySelector("#newChat");
        const clearChats = document.querySelector("#clearChats");
        const profileSelect = document.querySelector("#profileSelect");
        const newProfile = document.querySelector("#newProfile");
        const renameProfile = document.querySelector("#renameProfile");
        const deleteProfile = document.querySelector("#deleteProfile");
        const addMemoryFromChat = document.querySelector("#addMemoryFromChat");
        const clearMemory = document.querySelector("#clearMemory");
        const exportData = document.querySelector("#exportData");
        const importData = document.querySelector("#importData");
        const importFile = document.querySelector("#importFile");
        const transcribeAudio = document.querySelector("#transcribeAudio");
        const audioFile = document.querySelector("#audioFile");
        const openSettings = document.querySelector("#openSettings");
        const closeSettings = document.querySelector("#closeSettings");
        const settingsBackdrop = document.querySelector("#settingsBackdrop");
        const toggleKey = document.querySelector("#toggleKey");
        const resetConfig = document.querySelector("#resetConfig");
        let activeConfig = { ...defaultConfig };
        let currentConversationId = null;
        let conversations = [];
        let profilesState = null;
        let historySearchTerm = "";
        let activeChatElement = null;
        let lastMemoryCandidate = "";

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.addEventListener("upgradeneeded", () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains(CONVERSATION_STORE_NAME)) {
                        db.createObjectStore(CONVERSATION_STORE_NAME, { keyPath: "id" });
                    }
                });

                request.addEventListener("success", () => resolve(request.result));
                request.addEventListener("error", () => reject(request.error));
            });
        }

        function readStoredConfig() {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(CONFIG_ID);

                request.addEventListener("success", () => {
                    const saved = request.result;
                    if (!saved) {
                        resolve(null);
                        return;
                    }

                    const { id, ...config } = saved;
                    resolve(config);
                });

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => db.close());
            }));
        }

        function writeStoredConfig(config) {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id: CONFIG_ID, ...config });

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function deleteStoredConfig() {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(CONFIG_ID);

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function readProfilesState() {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(PROFILES_STATE_ID);

                request.addEventListener("success", () => resolve(request.result || null));
                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => db.close());
            }));
        }

        function writeProfilesState(state) {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id: PROFILES_STATE_ID, ...state });

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function readConversation(id) {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(CONVERSATION_STORE_NAME, "readonly");
                const store = transaction.objectStore(CONVERSATION_STORE_NAME);
                const request = store.get(id);

                request.addEventListener("success", () => resolve(request.result || null));
                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => db.close());
            }));
        }

        function readConversations() {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(CONVERSATION_STORE_NAME, "readonly");
                const store = transaction.objectStore(CONVERSATION_STORE_NAME);
                const request = store.getAll();

                request.addEventListener("success", () => {
                    const items = request.result || [];
                    items.sort((first, second) => {
                        if (Boolean(first.pinned) !== Boolean(second.pinned)) {
                            return first.pinned ? -1 : 1;
                        }
                        return (second.updatedAt || 0) - (first.updatedAt || 0);
                    });
                    resolve(items);
                });
                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => db.close());
            }));
        }

        function writeConversation(conversation) {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(CONVERSATION_STORE_NAME, "readwrite");
                const store = transaction.objectStore(CONVERSATION_STORE_NAME);
                const request = store.put(conversation);

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function deleteConversation(id) {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(CONVERSATION_STORE_NAME, "readwrite");
                const store = transaction.objectStore(CONVERSATION_STORE_NAME);
                const request = store.delete(id);

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function clearConversations() {
            return openDatabase().then((db) => new Promise((resolve, reject) => {
                const transaction = db.transaction(CONVERSATION_STORE_NAME, "readwrite");
                const store = transaction.objectStore(CONVERSATION_STORE_NAME);
                const request = store.clear();

                request.addEventListener("error", () => reject(request.error));
                transaction.addEventListener("complete", () => {
                    db.close();
                    resolve();
                });
                transaction.addEventListener("error", () => reject(transaction.error));
            }));
        }

        function readLegacyConfig() {
            try {
                const saved = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
                return saved ? { ...defaultConfig, ...saved } : null;
            } catch {
                return null;
            }
        }

        async function loadInitialConfig() {
            const storedProfilesState = await readProfilesState();
            if (storedProfilesState?.profiles?.length) {
                profilesState = {
                    activeProfileId: storedProfilesState.activeProfileId || storedProfilesState.profiles[0].id,
                    profiles: storedProfilesState.profiles
                };
                const activeProfile = profilesState.profiles.find((profile) => profile.id === profilesState.activeProfileId)
                    || profilesState.profiles[0];
                profilesState.activeProfileId = activeProfile.id;
                return { config: { ...defaultConfig, ...activeProfile.config }, hasSavedConfig: true };
            }

            const indexedConfig = await readStoredConfig();
            if (indexedConfig) {
                const config = { ...defaultConfig, ...indexedConfig };
                profilesState = createProfilesState(config);
                await writeProfilesState(profilesState);
                return { config, hasSavedConfig: true };
            }

            const legacyConfig = readLegacyConfig();
            if (legacyConfig) {
                await writeStoredConfig(legacyConfig);
                profilesState = createProfilesState(legacyConfig);
                await writeProfilesState(profilesState);
                localStorage.removeItem(LEGACY_STORAGE_KEY);
                return { config: legacyConfig, hasSavedConfig: true };
            }

            profilesState = createProfilesState(defaultConfig);
            await writeProfilesState(profilesState);
            return { config: { ...defaultConfig }, hasSavedConfig: false };
        }

        function createProfilesState(config) {
            const profile = {
                id: `profile-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                name: "Defaut",
                config: { ...defaultConfig, ...config }
            };
            return {
                activeProfileId: profile.id,
                profiles: [profile]
            };
        }

        function getActiveProfile() {
            return profilesState?.profiles?.find((profile) => profile.id === profilesState.activeProfileId)
                || profilesState?.profiles?.[0]
                || null;
        }

        async function saveProfilesState() {
            await writeProfilesState(profilesState);
            const activeProfile = getActiveProfile();
            if (activeProfile) {
                await writeStoredConfig(activeProfile.config);
            }
        }

        function renderProfiles() {
            profileSelect.innerHTML = "";
            (profilesState?.profiles || []).forEach((profile) => {
                const option = document.createElement("option");
                option.value = profile.id;
                option.textContent = profile.name;
                profileSelect.append(option);
            });
            profileSelect.value = profilesState?.activeProfileId || "";
        }

        function readFormConfig() {
            return {
                appName: appNameInput.value.trim() || defaultConfig.appName,
                theme: themeInput.value,
                apiKey: apiKeyInput.value.trim(),
                model: modelInput.value,
                audioModel: audioModelInput.value,
                temperature: Number(temperatureInput.value),
                systemPrompt: systemPromptInput.value.trim(),
                memoryNotes: normalizeMemoryNotes(memoryNotesInput.value.trim()),
                autoMemory: autoMemoryInput.checked
            };
        }

        function writeForm(config) {
            appNameInput.value = config.appName;
            themeInput.value = config.theme;
            apiKeyInput.value = config.apiKey;
            modelInput.value = config.model;
            audioModelInput.value = config.audioModel || defaultConfig.audioModel;
            temperatureInput.value = String(config.temperature);
            temperatureValue.textContent = Number(config.temperature).toFixed(1);
            systemPromptInput.value = config.systemPrompt;
            memoryNotesInput.value = normalizeMemoryNotes(config.memoryNotes || "");
            autoMemoryInput.checked = config.autoMemory !== false;
        }

        function applyPersonalization(config) {
            const appName = config.appName || defaultConfig.appName;
            document.body.dataset.theme = config.theme || defaultConfig.theme;
            document.title = `${appName} - Groq`;
            chatTitle.textContent = appName;
        }

        async function saveConfig(config) {
            const activeProfile = getActiveProfile();
            if (activeProfile) {
                activeProfile.config = { ...defaultConfig, ...config };
                await saveProfilesState();
            } else {
                await writeStoredConfig(config);
            }
            setSaveState(true);
        }

        function setSaveState(isSaved) {
            saveState.textContent = isSaved ? "Sauvegarde" : "Modifie";
            saveState.classList.toggle("is-saved", isSaved);
        }

        function setUnsavedState() {
            saveState.textContent = "Non sauvegarde";
            saveState.classList.remove("is-saved");
        }

        function setErrorState() {
            saveState.textContent = "Erreur";
            saveState.classList.remove("is-saved");
        }

        function openSettingsPanel() {
            document.body.classList.add("settings-open");
        }

        function closeSettingsPanel() {
            document.body.classList.remove("settings-open");
        }

        function openHistoryPanel() {
            document.body.classList.add("history-open");
        }

        function closeHistoryPanel() {
            document.body.classList.remove("history-open");
        }

        function showAppModal({ title = "LibreGRoq", message = "", defaultValue = "", input = false, danger = false, confirmText = "OK", cancelText = "Annuler" }) {
            return new Promise((resolve) => {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalInput.value = defaultValue;
                modalCard.classList.toggle("has-input", input);
                modalCancel.textContent = cancelText;
                modalConfirm.textContent = confirmText;
                modalConfirm.classList.toggle("danger-button", danger);
                appModal.setAttribute("aria-hidden", "false");
                document.body.classList.add("modal-open");

                const cleanup = (value) => {
                    document.body.classList.remove("modal-open");
                    appModal.setAttribute("aria-hidden", "true");
                    modalConfirm.classList.remove("danger-button");
                    modalConfirm.removeEventListener("click", onConfirm);
                    modalCancel.removeEventListener("click", onCancel);
                    appModal.removeEventListener("click", onBackdrop);
                    document.removeEventListener("keydown", onKeydown);
                    resolve(value);
                };

                const onConfirm = () => cleanup(input ? modalInput.value : true);
                const onCancel = () => cleanup(input ? null : false);
                const onBackdrop = (event) => {
                    if (event.target === appModal) {
                        onCancel();
                    }
                };
                const onKeydown = (event) => {
                    if (event.key === "Escape") {
                        onCancel();
                    }
                    if (event.key === "Enter" && input && document.activeElement === modalInput) {
                        onConfirm();
                    }
                };

                modalConfirm.addEventListener("click", onConfirm);
                modalCancel.addEventListener("click", onCancel);
                appModal.addEventListener("click", onBackdrop);
                document.addEventListener("keydown", onKeydown);

                window.setTimeout(() => {
                    if (input) {
                        modalInput.focus();
                        modalInput.select();
                    } else {
                        modalConfirm.focus();
                    }
                }, 0);
            });
        }

        function themedPrompt(message, defaultValue = "", title = "LibreGRoq") {
            return showAppModal({ title, message, defaultValue, input: true, confirmText: "Valider" });
        }

        function themedConfirm(message, title = "Confirmer") {
            return showAppModal({ title, message, danger: true, confirmText: "Confirmer" });
        }

        function themedAlert(message, title = "LibreGRoq") {
            return showAppModal({ title, message, cancelText: "Fermer" });
        }

        function createConversationObject() {
            const now = Date.now();
            return {
                id: `chat-${now}-${Math.random().toString(36).slice(2, 8)}`,
                title: "Nouveau chat",
                messages: [],
                pinned: false,
                createdAt: now,
                updatedAt: now
            };
        }

        function cleanMessage(message, fallbackRole = "ai") {
            return {
                role: message.role || fallbackRole,
                text: stripThinkBlocks(message.text || ""),
                html: stripThinkBlocks(message.html || ""),
                files: message.files,
                custom: message.custom
            };
        }

        function messageCharacterCount(message) {
            let customText = "";
            try {
                customText = message.custom ? JSON.stringify(message.custom) : "";
            } catch {
                customText = "";
            }

            return [
                message.text,
                message.html,
                customText
            ].join("").length;
        }

        function compactStoredMessages(messages) {
            const compacted = messages.slice(-MAX_STORED_MESSAGES);
            let totalCharacters = compacted.reduce((total, message) => total + messageCharacterCount(message), 0);

            while (compacted.length > 1 && totalCharacters > MAX_STORED_CHARACTERS) {
                const removed = compacted.shift();
                totalCharacters -= messageCharacterCount(removed);
            }

            return compacted;
        }

        function stripThinkBlocks(value) {
            if (typeof value !== "string") {
                return value;
            }

            return value
                .replace(/&lt;think[^&]*&gt;[\s\S]*?&lt;\/think&gt;/gi, "")
                .replace(/&lt;think[^&]*&gt;[\s\S]*$/gi, "")
                .replace(/&lt;\/think&gt;/gi, "")
                .replace(/&lt;think&gt;/gi, "")
                .replace(/<think>\s*<\/think>/gi, "")
                .replace(/<think[\s\S]*?<\/think>/gi, "")
                .replace(/<think[\s\S]*$/gi, "")
                .replace(/<\/think>/gi, "")
                .replace(/<think>/gi, "")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
        }

        function scrubRenderedThinkBlocks(root) {
            if (!root) {
                return;
            }

            const rootText = root.textContent || "";
            if (!/<think|<\/think|&lt;think|&lt;\/think/i.test(rootText)) {
                return;
            }

            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                nodes.push(walker.currentNode);
            }

            nodes.forEach((node) => {
                if (!/<think|<\/think|&lt;think|&lt;\/think/i.test(node.textContent || "")) {
                    return;
                }
                const clean = stripThinkBlocks(node.textContent);
                if (clean !== node.textContent) {
                    node.textContent = clean;
                }
            });

            [...root.querySelectorAll("*")].forEach((element) => {
                const text = element.textContent?.trim();
                if (text === "<think>" || text === "</think>") {
                    const hasMedia = element.querySelector("img, video, audio, canvas, svg, button, input, textarea");
                    if (!hasMedia && element.children.length === 0) {
                        element.remove();
                    }
                }
            });
        }

        function sanitizeProviderResponse(response) {
            if (typeof response === "string") {
                return stripThinkBlocks(response);
            }

            if (Array.isArray(response)) {
                return response.map(sanitizeProviderResponse);
            }

            if (!response || typeof response !== "object") {
                return response;
            }

            return Object.fromEntries(Object.entries(response).map(([key, value]) => {
                if (key === "content" || key === "text" || key === "html") {
                    return [key, stripThinkBlocks(value)];
                }
                return [key, sanitizeProviderResponse(value)];
            }));
        }

        function trimContextMessages(messages) {
            if (!Array.isArray(messages) || messages.length <= MAX_CONTEXT_MESSAGES) {
                return messages;
            }

            const keepIndexes = new Set();
            messages.forEach((message, index) => {
                const role = String(message?.role || "").toLowerCase();
                if (role === "system" || role === "developer") {
                    keepIndexes.add(index);
                }
            });

            messages
                .map((message, index) => ({ message, index }))
                .filter(({ message }) => {
                    const role = String(message?.role || "").toLowerCase();
                    return role !== "system" && role !== "developer";
                })
                .slice(-MAX_CONTEXT_MESSAGES)
                .forEach(({ index }) => keepIndexes.add(index));

            return messages.filter((_, index) => keepIndexes.has(index));
        }

        function limitGroqRequestContext(payload) {
            if (!payload) {
                return payload;
            }

            if (typeof payload === "string") {
                try {
                    return JSON.stringify(limitGroqRequestContext(JSON.parse(payload)));
                } catch {
                    return payload;
                }
            }

            if (Array.isArray(payload)) {
                return payload.map(limitGroqRequestContext);
            }

            if (typeof payload !== "object" || payload instanceof FormData) {
                return payload;
            }

            Object.entries(payload).forEach(([key, value]) => {
                if (key === "messages" && Array.isArray(value)) {
                    payload[key] = trimContextMessages(value);
                    return;
                }

                payload[key] = limitGroqRequestContext(value);
            });

            return payload;
        }

        function findLatestUserText(payload) {
            const found = [];

            function visit(value) {
                if (!value) {
                    return;
                }

                if (typeof value === "string") {
                    try {
                        visit(JSON.parse(value));
                    } catch {
                        if (/\b(je suis|jesuis|je m'appelle|mon nom est|je prefere|je préfère|j'aime|j'habite|je vis|mon métier|mon metier)\b/i.test(value)) {
                            found.push(value.trim());
                        }
                    }
                    return;
                }

                if (value instanceof FormData) {
                    for (const entryValue of value.values()) {
                        visit(entryValue);
                    }
                    return;
                }

                if (Array.isArray(value)) {
                    value.forEach(visit);
                    return;
                }

                if (typeof value !== "object") {
                    return;
                }

                const role = String(value.role || "").toLowerCase();
                if (role === "user") {
                    const content = value.text || value.content || value.message;
                    if (typeof content === "string" && content.trim()) {
                        found.push(content.trim());
                    }
                    if (Array.isArray(content)) {
                        content.forEach((part) => {
                            if (typeof part?.text === "string" && part.text.trim()) {
                                found.push(part.text.trim());
                            }
                        });
                    }
                }

                if (typeof value.text === "string" && /\b(je suis|jesuis|je m'appelle|mon nom est|je prefere|je préfère|j'aime|j'habite|je vis|mon métier|mon metier)\b/i.test(value.text)) {
                    found.push(value.text.trim());
                }

                Object.values(value).forEach(visit);
            }

            visit(payload);
            return found.at(-1) || "";
        }

        function rememberFromOutgoingRequest(payload) {
            const userText = findLatestUserText(payload);
            rememberTextCandidate(userText);
        }

        function rememberTextCandidate(text) {
            const normalized = (text || "").replace(/\s+/g, " ").trim();
            if (!normalized || activeConfig.autoMemory === false || normalized === lastMemoryCandidate) {
                return;
            }

            if (extractMemoryFacts(normalized).length === 0) {
                return;
            }

            lastMemoryCandidate = normalized;
            updateAutomaticMemory(normalized).catch((error) => {
                lastMemoryCandidate = "";
                console.error("Memoire automatique impossible", error);
            });
        }

        function stripThinkBlocksInPlace(value) {
            const clean = stripThinkBlocks(value);
            return clean || "";
        }

        function titleFromMessage(message) {
            const text = (message.text || "").replace(/\s+/g, " ").trim();
            return text ? text.slice(0, 42) : "Nouveau chat";
        }

        function formatConversationTime(timestamp) {
            if (!timestamp) {
                return "date inconnue";
            }

            return new Intl.DateTimeFormat("fr", {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }).format(new Date(timestamp));
        }

        async function refreshConversations() {
            conversations = await readConversations();
            renderHistoryList();
        }

        async function createNewConversation() {
            const conversation = createConversationObject();
            await writeConversation(conversation);
            currentConversationId = conversation.id;
            await refreshConversations();
            await renderChat(activeConfig);
            return conversation;
        }

        async function ensureActiveConversation() {
            conversations = await readConversations();
            if (conversations.length > 0) {
                currentConversationId = conversations[0].id;
                renderHistoryList();
                return conversations[0];
            }
            return createNewConversation();

        function renderHistoryList() {
            historyList.innerHTML = "";
            const filteredConversations = conversations.filter((conversation) => {
                if (!historySearchTerm) {
                    return true;
                }

                const searchable = [
                    conversation.title,
                    ...(conversation.messages || []).map((message) => message.text || "")
                ].join(" ").toLowerCase();

                return searchable.includes(historySearchTerm);
            });

            if (filteredConversations.length === 0) {
                const empty = document.createElement("div");
                empty.className = "history-empty";
                empty.textContent = conversations.length === 0 ? "Aucune conversation sauvegardee." : "Aucun resultat.";
                historyList.append(empty);
                return;
            }

            filteredConversations.forEach((conversation) => {
                const item = document.createElement("div");
                const main = document.createElement("button");
                const title = document.createElement("span");
                const time = document.createElement("span");
                const actions = document.createElement("div");
                const pin = document.createElement("button");
                const rename = document.createElement("button");
                const remove = document.createElement("button");

                item.className = `history-item${conversation.id === currentConversationId ? " is-active" : ""}`;
                main.className = "history-item-main";
                main.type = "button";
                title.className = "history-item-title";
                time.className = "history-item-time";
                actions.className = "history-item-actions";
                pin.className = `history-icon-button${conversation.pinned ? " is-pinned" : ""}`;
                rename.className = "history-icon-button";
                remove.className = "history-delete";
                pin.type = "button";
                rename.type = "button";
                remove.type = "button";
                pin.setAttribute("aria-label", conversation.pinned ? "Desepingler la conversation" : "Epingler la conversation");
                rename.setAttribute("aria-label", "Renommer la conversation");
                remove.setAttribute("aria-label", "Supprimer la conversation");

                title.textContent = `${conversation.pinned ? "★ " : ""}${conversation.title || "Nouveau chat"}`;
                time.textContent = `${conversation.messages?.length || 0} messages - ${formatConversationTime(conversation.updatedAt)}`;
                pin.textContent = conversation.pinned ? "★" : "☆";
                rename.textContent = "✎";
                remove.textContent = "×";

                main.append(title, time);
                main.addEventListener("click", async () => {
                    currentConversationId = conversation.id;
                    await refreshConversations();
                    await renderChat(activeConfig);
                    closeHistoryPanel();
                });

                pin.addEventListener("click", async () => {
                    await writeConversation({ ...conversation, pinned: !conversation.pinned, updatedAt: Date.now() });
                    await refreshConversations();
                });

                rename.addEventListener("click", async () => {
                    const nextTitle = await themedPrompt("Nouveau nom de la conversation", conversation.title || "Nouveau chat", "Renommer");
                    if (!nextTitle?.trim()) {
                        return;
                    }

                    await writeConversation({ ...conversation, title: nextTitle.trim(), updatedAt: Date.now() });
                    await refreshConversations();
                });

                remove.addEventListener("click", async () => {
                    await deleteConversation(conversation.id);
                    if (conversation.id === currentConversationId) {
                        currentConversationId = null;
                    }
                    await ensureActiveConversation();
                    await renderChat(activeConfig);
                });

                actions.append(pin, rename, remove);
                item.append(main, actions);
                historyList.append(item);
            });
        }

        async function appendMessageToActiveConversation(message) {
            if (!currentConversationId) {
                await createNewConversation();
            }

            const conversation = await readConversation(currentConversationId);
            if (!conversation) {
                await createNewConversation();
                return appendMessageToActiveConversation(message);
            }

            const clean = cleanMessage(message);
            const messages = compactStoredMessages([...(conversation.messages || []), clean]);
            const shouldRename = conversation.title === "Nouveau chat" && clean.role === "user";

            await writeConversation({
                ...conversation,
                title: shouldRename ? titleFromMessage(clean) : conversation.title,
                messages,
                updatedAt: Date.now()
            });

            if (clean.role === "user") {
                rememberTextCandidate(clean.text);
            }
            await refreshConversations();
        }

        function normalizeMemoryValue(value) {
            return (value || "")
                .replace(/\s+/g, " ")
                .replace(/[.,;:!?]+$/g, "")
                .trim();
        }

        function looksLikePersonName(value) {
            const clean = normalizeMemoryValue(value);
            if (!clean || clean.length > 42 || /[\d/@#]/.test(clean)) {
                return false;
            }

            const lower = clean.toLowerCase();
            if (/\b(dev|developpeur|développeur|programmeur|assistant|etudiant|étudiant|freelance|designer|admin|prof|professeur|entrepreneur|humain|personne|homme|femme)\b/i.test(lower)) {
                return false;
            }

            const words = clean.split(/\s+/).filter(Boolean);
            return words.length >= 1 && words.length <= 3 && words.every((word) => /^[a-zà-ÿ'-]{2,24}$/i.test(word));
        }

        function normalizeMemoryFactLabel(label, value) {
            if (label === "Profil utilisateur" && looksLikePersonName(value)) {
                return "Nom de l'utilisateur";
            }

            return label;
        }

        function normalizeMemoryNotes(notes) {
            const lines = (notes || "")
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);
            const normalizedLines = [];

            lines.forEach((line) => {
                const match = line.match(/^-\s*([^:]+):\s*(.+)$/);
                const normalizedLine = match
                    ? `- ${normalizeMemoryFactLabel(match[1].trim(), match[2].trim())}: ${normalizeMemoryValue(match[2])}`
                    : line;
                const exists = normalizedLines.some((item) => item.toLowerCase() === normalizedLine.toLowerCase());
                if (!exists) {
                    normalizedLines.push(normalizedLine);
                }
            });

            return normalizedLines.join("\n");
        }

        function extractMemoryFacts(text) {
            const normalized = (text || "").replace(/\s+/g, " ").trim();
            const facts = [];
            const patterns = [
                { regex: /\bje m'appelle ([^.!?\n]{2,60})/i, label: "Nom de l'utilisateur" },
                { regex: /\bmon nom est ([^.!?\n]{2,60})/i, label: "Nom de l'utilisateur" },
                { regex: /\bappelle[- ]moi ([^.!?\n]{2,60})/i, label: "Nom prefere" },
                { regex: /\bjesuis (?:un |une |le |la |l')?([^.!?\n]{2,90})/i, label: "Profil utilisateur" },
                { regex: /\bje suis (?:un |une |le |la |l')?([^.!?\n]{2,90})/i, label: "Profil utilisateur" },
                { regex: /\bje suis en train de ([^.!?\n]{2,90})/i, label: "Activite actuelle" },
                { regex: /\bmon metier est ([^.!?\n]{2,90})/i, label: "Metier" },
                { regex: /\bmon métier est ([^.!?\n]{2,90})/i, label: "Metier" },
                { regex: /\bj'habite (?:a |à |en )?([^.!?\n]{2,90})/i, label: "Lieu" },
                { regex: /\bje vis (?:a |à |en )?([^.!?\n]{2,90})/i, label: "Lieu" },
                { regex: /\bma langue est ([^.!?\n]{2,90})/i, label: "Langue" },
                { regex: /\bje prefere ([^.!?\n]{2,90})/i, label: "Preference" },
                { regex: /\bje préfère ([^.!?\n]{2,90})/i, label: "Preference" },
                { regex: /\bj'aime ([^.!?\n]{2,90})/i, label: "Aime" },
                { regex: /\bje n'aime pas ([^.!?\n]{2,90})/i, label: "N'aime pas" },
                { regex: /\bje travaille (?:sur|dans|avec|comme) ([^.!?\n]{2,90})/i, label: "Travail" },
                { regex: /\breponds? (?:toujours )?(?:en|avec) ([^.!?\n]{2,90})/i, label: "Style de reponse" },
                { regex: /\bréponds? (?:toujours )?(?:en|avec) ([^.!?\n]{2,90})/i, label: "Style de reponse" }
            ];

            patterns.forEach(({ regex, label }) => {
                const match = normalized.match(regex);
                if (match?.[1]) {
                    const value = normalizeMemoryValue(match[1]);
                    facts.push(`${normalizeMemoryFactLabel(label, value)}: ${value}`);
                }
            });

            return facts;
        }

        async function updateAutomaticMemory(text) {
            const facts = extractMemoryFacts(text);
            if (facts.length === 0) {
                return;
            }

            const currentLines = normalizeMemoryNotes(activeConfig.memoryNotes || "")
                .split("\n")
                .map((line) => line.trim())
                .filter(Boolean);
            let changed = false;

            facts.forEach((fact) => {
                const memoryLine = `- ${fact}`;
                const exists = currentLines.some((line) => line.toLowerCase() === memoryLine.toLowerCase());
                if (!exists) {
                    currentLines.push(memoryLine);
                    changed = true;
                }
            });

            if (!changed) {
                return;
            }

            activeConfig = {
                ...activeConfig,
                memoryNotes: currentLines.join("\n")
            };
            memoryNotesInput.value = activeConfig.memoryNotes;
            writeForm(activeConfig);
            await saveConfig(activeConfig);
            syncActiveChatConnection();
            chatStatus.textContent = "Memoire ajoutee";
            window.setTimeout(() => {
                chatStatus.textContent = "Pret";
            }, 2200);
        }

        function buildSystemPrompt(config) {
            const basePrompt = config.systemPrompt || defaultConfig.systemPrompt;
            const prompt = `${basePrompt}\n\nNe montre jamais ton raisonnement interne. Ne produis jamais de balises <think> ou </think>. Reponds directement a l'utilisateur.`;
            const memory = (config.memoryNotes || "").trim();

            if (!memory) {
                return prompt;
            }

            return `${prompt}\n\nMemoire persistante de l'utilisateur:\n${memory}`;
        }

        function buildDirectConnection(config) {
            const directConnection = {
                groq: {
                    key: config.apiKey,
                    chat: {
                        model: config.model,
                        temperature: config.temperature
                    }
                }
            };
            const systemPrompt = buildSystemPrompt(config);
            if (systemPrompt) {
                directConnection.groq.chat.system_prompt = systemPrompt;
            }
            return directConnection;
        }

        function syncActiveChatConnection() {
            if (!activeChatElement || !activeConfig.apiKey) {
                return;
            }

            activeChatElement.setAttribute("directConnection", JSON.stringify(buildDirectConnection(activeConfig)));
        }

        function transcriptFromConversation(conversation, onlyLastAi = false) {
            const messages = conversation?.messages || [];
            const selectedMessages = onlyLastAi
                ? [...messages].reverse().filter((message) => (message.role || "ai") !== "user").slice(0, 1).reverse()
                : messages;

            return selectedMessages.map((message) => {
                const role = (message.role || "ai") === "user" ? "Vous" : "Assistant";
                return `${role}: ${message.text || message.html || ""}`;
            }).join("\n\n").trim();
        }

        async function copyText(text) {
            if (!text) {
                chatStatus.textContent = "Vide";
                return;
            }

            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const copyArea = document.createElement("textarea");
                copyArea.value = text;
                copyArea.style.position = "fixed";
                copyArea.style.opacity = "0";
                document.body.append(copyArea);
                copyArea.select();
                document.execCommand("copy");
                copyArea.remove();
            }
            chatStatus.textContent = "Copie";
            window.setTimeout(() => {
                chatStatus.textContent = "Pret";
            }, 1400);
        }

        async function transcribeAudioFile(file) {
            if (!activeConfig.apiKey) {
                await themedAlert("Ajoutez une cle API Groq avant de transcrire un audio.", "Cle API requise");
                openSettingsPanel();
                return;
            }

            if (!file) {
                return;
            }

            chatStatus.textContent = "Audio";
            transcribeAudio.disabled = true;

            try {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("model", activeConfig.audioModel || defaultConfig.audioModel);
                formData.append("response_format", "json");

                const response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${activeConfig.apiKey}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `Erreur ${response.status}`);
                }

                const result = await response.json();
                const transcript = (result.text || "").trim();

                if (!transcript) {
                    await themedAlert("Aucune transcription retournee pour cet audio.", "Audio");
                    return;
                }

                if (activeChatElement?.submitUserMessage) {
                    activeChatElement.submitUserMessage({ text: transcript });
                } else {
                    await appendMessageToActiveConversation({ role: "user", text: transcript });
                    await renderChat(activeConfig);
                }
            } catch (error) {
                console.error("Transcription audio impossible", error);
                await themedAlert("Impossible de transcrire cet audio. Verifiez la cle API, le format audio et les limites Groq.", "Erreur audio");
            } finally {
                transcribeAudio.disabled = false;
                audioFile.value = "";
                chatStatus.textContent = "Pret";
            }
        }

        async function exportAllData() {
            const exportPayload = {
                app: "LibreGRoq",
                version: 1,
                exportedAt: new Date().toISOString(),
                profilesState,
                activeConfig,
                conversations: await readConversations()
            };
            const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `libregroq-export-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.append(link);
            link.click();
            URL.revokeObjectURL(link.href);
            link.remove();
        }

        async function importAllData(file) {
            const content = await file.text();
            const imported = JSON.parse(content);

            if (imported.profilesState?.profiles?.length) {
                profilesState = imported.profilesState;
                if (!getActiveProfile()) {
                    profilesState.activeProfileId = profilesState.profiles[0].id;
                }
            } else if (imported.activeConfig) {
                profilesState = createProfilesState({ ...defaultConfig, ...imported.activeConfig });
            } else {
                throw new Error("Fichier JSON LibreGRoq invalide");
            }

            await writeProfilesState(profilesState);
            activeConfig = { ...defaultConfig, ...getActiveProfile().config };
            await writeStoredConfig(activeConfig);

            if (Array.isArray(imported.conversations)) {
                await clearConversations();
                for (const conversation of imported.conversations) {
                    await writeConversation({
                        ...conversation,
                        pinned: Boolean(conversation.pinned),
                        messages: (conversation.messages || []).map(cleanMessage)
                    });
                }
            }

            writeForm(activeConfig);
            applyPersonalization(activeConfig);
            renderProfiles();
            await ensureActiveConversation();
            await refreshConversations();
            await renderChat(activeConfig);
            setSaveState(true);
        }

        function appendMemory(text) {
            const current = memoryNotesInput.value.trim();
            memoryNotesInput.value = current ? `${current}\n- ${text}` : `- ${text}`;
            setSaveState(false);
            activeConfig = readFormConfig();
        }
