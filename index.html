                            }
                        }
                    },
                    intro: {
                        bubble: {
                            background: aiBubbleBackground,
                            border: `1px solid ${line}`,
                            color: muted,
                            boxShadow: isCyberpunk ? "0 0 18px rgba(0, 229, 255, 0.10)" : "none"
                        }
                    },
                    error: {
                        bubble: {
                            borderRadius: "14px"
                        }
                    }
                },
                submitButtonStyles: {
                    submit: {
                        container: {
                            default: {
                                background: isCyberpunk ? "linear-gradient(135deg, #00e5ff, #ff2bd6)" : accent,
                                borderRadius: "12px",
                                boxShadow: isCyberpunk ? "0 0 18px rgba(0, 229, 255, 0.30)" : "none"
                            },
                            hover: {
                                background: accentStrong
                            },
                            click: {
                                background: accentStrong
                            }
                        },
                        svg: {
                            styles: {
                                default: {
                                    filter: "brightness(0) invert(1)"
                                }
                            }
                        }
                    },
                    loading: {
                        container: {
                            default: {
                                backgroundColor: accentStrong
                            }
                        }
                    },
                    position: "inside-right"
                },
                auxiliaryStyle: `
                    ::-webkit-scrollbar { width: 10px; height: 10px; }
                    ::-webkit-scrollbar-thumb {
                        background: ${line};
                        border-radius: 999px;
                    }
                    ::-webkit-scrollbar-track { background: ${panel}; }
                    .libregroq-copy-bubble:hover {
                        border-color: ${accent} !important;
                        color: ${accent} !important;
                    }
                    pre, code {
                        background: ${panel} !important;
                        color: ${text} !important;
                        border-color: ${line} !important;
                    }
                    a { color: ${accent} !important; }
                `,
                containerStyle: {
                    background: isCyberpunk
                        ? "radial-gradient(circle at top left, rgba(0, 229, 255, 0.08), transparent 22rem), radial-gradient(circle at bottom right, rgba(255, 43, 214, 0.08), transparent 22rem), #0d1022"
                        : panel,
                    color: text
                }
            };
        }

        function getEditableText(element) {
            if (!element) {
                return "";
            }

            if (typeof element.value === "string") {
                return element.value;
            }

            if (element.isContentEditable) {
                return element.innerText || element.textContent || "";
            }

            return element.textContent || "";
        }

        function isEditableChatElement(element) {
            return element instanceof Element && element.matches("textarea, input[type='text'], [contenteditable='true'], [contenteditable='']");
        }

        function findChatDraftText(root, preferredElement) {
            const preferredText = isEditableChatElement(preferredElement) ? getEditableText(preferredElement).trim() : "";
            if (preferredText) {
                return preferredText;
            }

            const input = root?.querySelector("textarea, input[type='text'], [contenteditable='true'], [contenteditable='']");
            return getEditableText(input).trim();
        }

        function installMemoryInputCapture(chat) {
            const root = chat.shadowRoot;
            if (!root || chat.dataset.memoryCaptureInstalled === "1") {
                return;
            }

            chat.dataset.memoryCaptureInstalled = "1";
            let lastDraftText = "";

            function captureDraft(event) {
                const text = findChatDraftText(root, event?.target);
                if (text) {
                    lastDraftText = text;
                }
            }

            function commitDraft(event) {
                captureDraft(event);
                rememberTextCandidate(lastDraftText);
            }

            root.addEventListener("input", captureDraft, true);
            root.addEventListener("change", captureDraft, true);
            root.addEventListener("submit", commitDraft, true);
            root.addEventListener("keydown", (event) => {
                captureDraft(event);
                if (event.key === "Enter" && !event.shiftKey && !event.ctrlKey && !event.metaKey) {
                    commitDraft(event);
                }
            }, true);
            root.addEventListener("pointerdown", (event) => {
                const target = event.target instanceof Element ? event.target : null;
                if (target?.closest("button, [role='button'], [aria-label], svg")) {
                    commitDraft(event);
                }
            }, true);
        }

        function installBubbleCopyButtons(chat) {
            const root = chat.shadowRoot;
            if (!root) {
                return;
            }

            const accent = getThemeToken("--accent");
            const panel = getThemeToken("--panel");
            const panelSoft = getThemeToken("--panel-soft");
            const text = getThemeToken("--text");
            const line = getThemeToken("--line");
            const isCyberpunk = document.body.dataset.theme === "cyberpunk";

            function styleCopyButton(button) {
                Object.assign(button.style, {
                    display: "inline-flex",
                    alignItems: "center",
                    alignSelf: "flex-start",
                    minHeight: "26px",
                    marginTop: "8px",
                    padding: "4px 8px",
                    border: `1px solid ${line}`,
                    borderRadius: "999px",
                    background: isCyberpunk ? "rgba(13, 16, 34, 0.92)" : panel,
                    color: text,
                    font: "600 12px system-ui, sans-serif",
                    cursor: "pointer",
                    boxShadow: isCyberpunk ? "0 0 12px rgba(0, 229, 255, 0.12)" : "none"
                });
            }

            function decorate() {
                scrubRenderedThinkBlocks(root);
                const bubbles = [...root.querySelectorAll("[style*='border-radius: 14px'], [style*='border-radius:14px']")];
                bubbles.forEach((bubble) => {
                    if (bubble.querySelector(".libregroq-copy-bubble")) {
                        return;
                    }

                    const textToCopy = (bubble.textContent || "").trim();
                    const hadThinkMarkup = /<think|<\/think|&lt;think|&lt;\/think/i.test(`${textToCopy} ${bubble.innerHTML}`);
                    const cleanBubbleText = stripThinkBlocks(textToCopy);
                    if (!cleanBubbleText) {
                        if (hadThinkMarkup) {
                            bubble.remove();
                        }
                        return;
                    }
                    if (cleanBubbleText !== textToCopy) {
                        bubble.childNodes.forEach((node) => {
                            if (node.nodeType === Node.TEXT_NODE) {
                                node.textContent = stripThinkBlocks(node.textContent);
                            }
                        });
                        bubble.innerHTML = stripThinkBlocks(bubble.innerHTML);
                    }

                    if (cleanBubbleText === "Configuration chargee. Le chat est pret.") {
                        return;
                    }

                    bubble.style.display = "flex";
                    bubble.style.flexDirection = "column";
                    bubble.style.backgroundColor = bubble.style.backgroundColor || panelSoft;

                    const button = document.createElement("button");
                    button.className = "libregroq-copy-bubble";
                    button.type = "button";
                    button.textContent = "Copier";
                    button.addEventListener("mouseenter", () => {
                        button.style.borderColor = accent;
                        button.style.color = accent;
                        if (isCyberpunk) {
                            button.style.boxShadow = "0 0 18px rgba(0, 229, 255, 0.24)";
                        }
                    });
                    button.addEventListener("mouseleave", () => {
                        button.style.borderColor = line;
                        button.style.color = text;
                        if (isCyberpunk) {
                            button.style.boxShadow = "0 0 12px rgba(0, 229, 255, 0.12)";
                        }
                    });
                    button.addEventListener("click", (event) => {
                        event.stopPropagation();
                        copyText(cleanBubbleText);
                    });
                    styleCopyButton(button);
                    bubble.append(button);
                });
            }

            decorate();
            const observer = new MutationObserver(() => {
                window.requestAnimationFrame(decorate);
            });
            observer.observe(root, { childList: true, subtree: true });
        }

        function renderEmptyChat() {
            chatMount.innerHTML = "";
            activeChatElement = null;
            const empty = document.createElement("div");
            empty.className = "empty-chat";
            const content = document.createElement("div");
            const message = document.createElement("span");
            const settingsLink = document.createElement("button");

            content.className = "empty-chat-content";
            message.textContent = "Ajoutez une cle API Groq puis sauvegardez la configuration.";
            settingsLink.className = "empty-chat-action";
            settingsLink.type = "button";
            settingsLink.textContent = "Ouvrir les reglages";
            settingsLink.addEventListener("click", openSettingsPanel);

            content.append(message, settingsLink);
            empty.append(content);
            chatMount.append(empty);
            activeModel.textContent = "En attente";
            chatStatus.textContent = "Config";
        }

        async function renderChat(config) {
            chatMount.innerHTML = "";

            if (!config.apiKey) {
                renderEmptyChat();
                return;
            }

            const conversation = currentConversationId ? await readConversation(currentConversationId) : null;
            const historyMessages = (conversation?.messages || []).map(cleanMessage);
            const chat = document.createElement("deep-chat");
            const directConnection = buildDirectConnection(config);

            const chatStyles = getChatStyles();
            Object.assign(chat.style, chatStyles.containerStyle);
            chat.setAttribute("directConnection", JSON.stringify(directConnection));
            chat.setAttribute("history", JSON.stringify(historyMessages));
            chat.setAttribute("auxiliaryStyle", chatStyles.auxiliaryStyle);
            chat.setAttribute("scrollButton", JSON.stringify({
                styles: {
                    default: {
                        backgroundColor: getThemeToken("--panel-soft"),
                        color: getThemeToken("--text"),
                        border: `1px solid ${getThemeToken("--line")}`
                    },
                    hover: {
                        backgroundColor: getThemeToken("--accent")
                    }
                }
            }));
            chat.setAttribute("inputAreaStyle", JSON.stringify(chatStyles.inputAreaStyle));
            chat.setAttribute("textInput", JSON.stringify(chatStyles.textInput));
            chat.setAttribute("messageStyles", JSON.stringify(chatStyles.messageStyles));
            chat.setAttribute("submitButtonStyles", JSON.stringify(chatStyles.submitButtonStyles));
            chat.setAttribute("introMessage", JSON.stringify({ text: "Configuration chargee. Le chat est pret." }));
            chat.validateInput = (text, files) => {
                const hasText = Boolean(text?.trim());
                const hasFiles = Boolean(files?.length);
                if (hasText) {
                    rememberTextCandidate(text);
                }
                return hasText || hasFiles;
            };
            chat.responseInterceptor = (response) => sanitizeProviderResponse(response);
            chat.requestInterceptor = (requestDetails) => {
                rememberFromOutgoingRequest(requestDetails.body);
                requestDetails.body = limitGroqRequestContext(sanitizeProviderResponse(requestDetails.body));
                return requestDetails;
            };
            chat.onMessage = (body) => {
                if (!body?.message || body.isHistory) {
                    return;
                }
                body.message = cleanMessage(body.message, body.isUser ? "user" : "ai");
                if (body.message.text) {
                    body.message.text = stripThinkBlocksInPlace(body.message.text);
                }
                if (body.message.html) {
                    body.message.html = stripThinkBlocksInPlace(body.message.html);
                }
                appendMessageToActiveConversation(body.message).catch((error) => {
                    console.error("Impossible de sauvegarder le message", error);
                    chatStatus.textContent = "Erreur";
                });
                window.setTimeout(() => {
                    scrubRenderedThinkBlocks(chat.shadowRoot);
                    installMemoryInputCapture(chat);
                    installBubbleCopyButtons(chat);
                }, 60);
                window.setTimeout(() => scrubRenderedThinkBlocks(chat.shadowRoot), 180);
            };
            chatMount.append(chat);
            activeChatElement = chat;
            window.setTimeout(() => {
                scrubRenderedThinkBlocks(chat.shadowRoot);
                installMemoryInputCapture(chat);
                installBubbleCopyButtons(chat);
            }, 120);
            window.setTimeout(() => {
                scrubRenderedThinkBlocks(chat.shadowRoot);
                installMemoryInputCapture(chat);
            }, 500);
            activeModel.textContent = config.model;
            chatStatus.textContent = "Pret";
        }

        async function initializeApp() {
            let { config, hasSavedConfig } = await loadInitialConfig();
            const normalizedMemory = normalizeMemoryNotes(config.memoryNotes || "");
            if (normalizedMemory !== (config.memoryNotes || "").trim()) {
                config = { ...config, memoryNotes: normalizedMemory };
                await saveConfig(config);
            }
            activeConfig = config;
            writeForm(config);
            renderProfiles();
            applyPersonalization(config);
            if (hasSavedConfig) {
                setSaveState(true);
            } else {
                setUnsavedState();
            }
            await ensureActiveConversation();
            await renderChat(config);
        }

        temperatureInput.addEventListener("input", () => {
            temperatureValue.textContent = Number(temperatureInput.value).toFixed(1);
            setSaveState(false);
        });

        form.addEventListener("input", () => {
            setSaveState(false);
            applyPersonalization(readFormConfig());
        });

        profileSelect.addEventListener("change", async () => {
            const activeProfile = getActiveProfile();
            if (activeProfile) {
                activeProfile.config = readFormConfig();
            }
            profilesState.activeProfileId = profileSelect.value;
            const nextProfile = getActiveProfile();
            activeConfig = { ...defaultConfig, ...nextProfile.config };
            writeForm(activeConfig);
            applyPersonalization(activeConfig);
            renderProfiles();
            await saveProfilesState();
            await renderChat(activeConfig);
            setSaveState(true);
        });

        newProfile.addEventListener("click", async () => {
            const name = await themedPrompt("Nom du nouveau profil", "Nouveau profil", "Nouveau profil");
            if (!name?.trim()) {
                return;
            }

            const profile = {
                id: `profile-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
                name: name.trim(),
                config: { ...defaultConfig, ...readFormConfig() }
            };
            profilesState.profiles.push(profile);
            profilesState.activeProfileId = profile.id;
            activeConfig = profile.config;
            renderProfiles();
            writeForm(activeConfig);
            applyPersonalization(activeConfig);
            await saveProfilesState();
            await renderChat(activeConfig);
            setSaveState(true);
        });

        renameProfile.addEventListener("click", async () => {
            const activeProfile = getActiveProfile();
            if (!activeProfile) {
                return;
            }

            const name = await themedPrompt("Nouveau nom du profil", activeProfile.name, "Renommer le profil");
            if (!name?.trim()) {
                return;
            }

            activeProfile.name = name.trim();
            renderProfiles();
            await saveProfilesState();
        });

        deleteProfile.addEventListener("click", async () => {
            if ((profilesState?.profiles || []).length <= 1) {
                await themedAlert("Gardez au moins un profil.", "Profil requis");
                return;
            }

            const activeProfile = getActiveProfile();
            if (!await themedConfirm(`Supprimer le profil "${activeProfile.name}" ?`, "Supprimer le profil")) {
                return;
            }

            profilesState.profiles = profilesState.profiles.filter((profile) => profile.id !== activeProfile.id);
            profilesState.activeProfileId = profilesState.profiles[0].id;
            activeConfig = { ...defaultConfig, ...profilesState.profiles[0].config };
            renderProfiles();
            writeForm(activeConfig);
            applyPersonalization(activeConfig);
            await saveProfilesState();
            await renderChat(activeConfig);
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const config = readFormConfig();
            try {
                await saveConfig(config);
                activeConfig = config;
                applyPersonalization(config);
                await renderChat(config);
                closeSettingsPanel();
            } catch (error) {
                console.error("Impossible de sauvegarder la configuration IndexedDB", error);
                setErrorState();
            }
        });

        toggleKey.addEventListener("click", () => {
            const isHidden = apiKeyInput.type === "password";
            apiKeyInput.type = isHidden ? "text" : "password";
            toggleKey.textContent = isHidden ? "Masquer" : "Afficher";
        });

        openSettings.addEventListener("click", openSettingsPanel);
        closeSettings.addEventListener("click", closeSettingsPanel);
        settingsBackdrop.addEventListener("click", closeSettingsPanel);
        openHistory.addEventListener("click", openHistoryPanel);
        closeHistory.addEventListener("click", closeHistoryPanel);
        historyBackdrop.addEventListener("click", closeHistoryPanel);
        transcribeAudio.addEventListener("click", () => audioFile.click());
        audioFile.addEventListener("change", async () => {
            await transcribeAudioFile(audioFile.files?.[0]);
        });

        newChat.addEventListener("click", async () => {
            await createNewConversation();
            closeHistoryPanel();
        });

        historySearch.addEventListener("input", () => {
            historySearchTerm = historySearch.value.trim().toLowerCase();
            renderHistoryList();
        });

        clearChats.addEventListener("click", async () => {
            if (!await themedConfirm("Effacer tout l'historique des chats ?", "Effacer l'historique")) {
                return;
            }

            await clearConversations();
            currentConversationId = null;
            await ensureActiveConversation();
            await renderChat(activeConfig);
        });

        clearMemory.addEventListener("click", () => {
            memoryNotesInput.value = "";
            activeConfig = readFormConfig();
            setSaveState(false);
        });

        addMemoryFromChat.addEventListener("click", async () => {
            const conversation = await readConversation(currentConversationId);
            const lastUserMessage = [...(conversation?.messages || [])]
                .reverse()
                .find((message) => message.role === "user");
            const suggestion = lastUserMessage?.text ? `Preference ou info: ${lastUserMessage.text}` : "";
            const memory = await themedPrompt("Information a ajouter a la memoire", suggestion, "Memoire");
            if (!memory?.trim()) {
                return;
            }

            appendMemory(memory.trim());
        });

        exportData.addEventListener("click", () => {
            exportAllData().catch((error) => {
                console.error("Export impossible", error);
                setErrorState();
            });
        });

        importData.addEventListener("click", () => importFile.click());

        importFile.addEventListener("change", async () => {
            const file = importFile.files?.[0];
            if (!file) {
                return;
            }

            try {
                await importAllData(file);
            } catch (error) {
                console.error("Import impossible", error);
                setErrorState();
            } finally {
                importFile.value = "";
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeSettingsPanel();
                closeHistoryPanel();
            }
        });

        resetConfig.addEventListener("click", async () => {
            try {
                await deleteStoredConfig();
                localStorage.removeItem(LEGACY_STORAGE_KEY);
                profilesState = createProfilesState(defaultConfig);
                await writeProfilesState(profilesState);
                writeForm(defaultConfig);
                activeConfig = { ...defaultConfig };
                renderProfiles();
                applyPersonalization(defaultConfig);
                setUnsavedState();
                renderEmptyChat();
                closeSettingsPanel();
            } catch (error) {
                console.error("Impossible de supprimer la configuration IndexedDB", error);
                setErrorState();
            }
        });

        initializeApp().catch((error) => {
            console.error("Impossible de charger la configuration IndexedDB", error);
            writeForm(defaultConfig);
            applyPersonalization(defaultConfig);
            setUnsavedState();
            renderEmptyChat();
        });
    </script>
</body>
</html>
